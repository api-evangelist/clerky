name: Clerky
description: >-
  Clerky is an online legal service that helps startup founders handle their
  legal paperwork safely and efficiently. Designed by startup attorneys formerly
  at a Silicon Valley law firm, Clerky provides software and guided workflows for
  Delaware incorporation and post-incorporation setup, fundraising (SAFEs,
  convertible notes, board consents), hiring (offer letters, consulting
  agreements, equity compensation), commercial documents (NDAs), and ongoing
  corporate maintenance. Clerky is a Y Combinator portfolio company. It is a
  legal document assistant rather than a law firm, and does not currently
  publish a public developer API, developer portal, or programmatic
  integrations.
